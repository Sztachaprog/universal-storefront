name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: storefront
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4           # download code from repo

      - name: Setup Python
        uses: actions/setup-python@v5       # uses - you using github function
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Install Playwright browsers
        run: poetry run playwright install --with-deps chromium                           # --with-deps - library etc to use browser on ubuntu

      - name: Run integration tests
        id: db_tests
        run: poetry run pytest tests/database --alluredir=allure-results

      - name: Start Flask
        id: start_flask
        if: always() && steps.db_tests.outcome != 'skipped'
        run: |
          poetry run python -m flask --app src.app run --port 5000 > flask.log 2>&1 &     # flask.log - catch flask log, 2>&1 - catch error log
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5001/login; then                    # curl - send request to flask, -s silent, -f fail on 4xx/5xx, -o /dev/null - output to /dev/null check if flask is up
              echo "Flask is up after ${i}s"
              exit 0                                                                      # exit 0 - exit with success
            fi
            sleep 1
          done
          echo "Flask did not start within 30s"                                           
          cat flask.log                                                                   # cat flask.log - print log to console github action
          exit 1                                                                          # exit 1 - exit with error
        
      - name: Run API tests
        id: api_tests
        if: always() && steps.start_flask.outcome == 'success'
        run: poetry run pytest tests/api --alluredir=allure-results

      - name: Run E2E tests
        id: e2e_tests
        if: always() && steps.start_flask.outcome == 'success'
        run: poetry run pytest tests/e2e --alluredir=allure-results
        
      - name: Install allure commandline
        if: always() && steps.db_tests.outcome != 'skipped'
        run: npm install -g allure-commandline

      - name: Generate allure report
        if: always() && steps.db_tests.outcome != 'skipped'
        run: allure generate allure-results
      
      - name: Upload allure report
        if: always() && steps.db_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4                                                # actions github orgranization, upload-artifact - upload files to github, @v4 - version of action
        with:
          name: allure-report
          path: allure-report   